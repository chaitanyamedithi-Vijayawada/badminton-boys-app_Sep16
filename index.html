<meta name="theme-color" content="#040e10" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Badminton Boys" />

    <!-- Meta -->

</head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      // OneSignal (push notifications) is strictly optional. It must NEVER be
      // able to break the app — if init fails (e.g. a domain mismatch in the
      // OneSignal dashboard, or the SDK not loading), we swallow the error and
      // carry on. Login and every other feature work without it.
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          await OneSignal.init({
            appId: "d4b596d7-2437-46e4-b883-cf06b43bc590",
            notifyButton: { enable: false },
            allowLocalhostAsSecureOrigin: true,
            promptOptions: {
              slidedown: {
                prompts: [{
                  type: "push",
                  autoPrompt: true,
                  text: {
                    actionMessage: "Get notified about sessions and updates!",
                    acceptButton: "Allow",
                    cancelButton: "No thanks"
                  },
                  delay: { pageViews: 1, timeDelay: 5 }
                }]
              }
            }
          });
        } catch (e) {
          console.warn("OneSignal init skipped:", e);
        }
      });
      // Catch any async rejection OneSignal throws outside our try/catch so it
      // can't surface as an unhandled error that disrupts the app.
      window.addEventListener("unhandledrejection", function (ev) {
        var msg = ev && ev.reason && (ev.reason.message || String(ev.reason));
        if (msg && msg.indexOf("Can only be used on") !== -1) {
          ev.preventDefault(); // OneSignal domain mismatch — harmless, ignore
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
